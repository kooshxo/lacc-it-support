# Automatic PR creation is intentionally disabled.
# Open pull requests manually when a change is ready for review.
# Keeping a manual trigger preserves an explicit review workflow without
# running a GitHub Actions job for every branch push.
name: Manual PR review helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidance:
    name: Manual review guidance
    runs-on: ubuntu-latest
    steps:
      - name: Show manual pull request instructions
        run: echo "Automatic PR creation is disabled. Open a pull request manually when ready."
